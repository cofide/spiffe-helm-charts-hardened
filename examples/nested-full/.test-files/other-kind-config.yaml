kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "172.17.0.1"
  apiServerPort: 5443
  podSubnet: "10.246.0.0/16"
  serviceSubnet: "10.98.0.0/16"
nodes:
  - role: control-plane
    extraMounts:
      # Cofide: reuse the runner's ECR-authenticated docker credentials so kubelet can
      # pull the private cofide/spire-agent and cofide/spire-server images without an
      # imagePullSecret. Populated by the "Login to Amazon ECR" CI step.
      - hostPath: /home/runner/.docker/config.json
        containerPath: /var/lib/kubelet/config.json
